# mkedit.cfg -- the default configuration, every setting shown at its default.
#
# Copy this file to ~/.config/mkedit/mkedit.cfg (or $XDG_CONFIG_HOME/mkedit/mkedit.cfg) and change what you
# like. Lines starting with '#' are comments (a comment must be on a line of its own). mkedit reads the file
# when it starts. Colours can also be edited from inside the editor: Esc O L.

# ---- modes at start-up ------------------------------------------------------------------------
#insert = on
#autoindent = on
#wordwrap = off
#entermatching = off
#smarttabs = off
#backup = on                # keep NAME.bak when saving
#trimblanks = on            # remove trailing blanks from lines you edited
#eofmarker = on             # show <*** End of File ***>
#lastfileprompt = on        # closing the last file asks for another instead of quitting
#cutcopyline = on           # Cut/Copy use the cursor line when no block is marked
#lineblockbefore = off      # paste line blocks after (off) or above (on) the cursor line
#delchjoin = on
#returnsplit = on
#delrtwordblanks = on
#findoptions = I            # I ignore case, W words only, B backward
#replaceoptions = I         # also N: no prompting
#killbuffer = 30
#extensions = .c .h         # tried in turn for a file name that does not exist and has no dot
#expandtabs = auto          # auto | on | off (auto keeps the tabs of files that already have them)
#tabsout = off
#rmargin = 76
#tabwidth = 8
#ctabwidth = 4
#screenstep = 8

# ---- colours: color_NAME = foreground(0-15),background(0-7) ---------------------------------------
#color_text = 7,1
#color_block = 0,7
#color_status = 0,3
#color_statusoff = 0,7
#color_menu = 0,7
#color_menuselect = 15,0
#color_box = 15,3
#color_message = 15,2
#color_menuhot = 4,0

# ---- your own keys ----------------------------------------------------------------------------
# key <keyname> = <Command>      rebind a key (two keys for a sequence: key C-k a = DropAnchor)
# key <keyname> = none           free a key
# key <keyname> = MacroBegin EditFile 'notes.txt' Return     a key macro: commands and quoted text
# Key names: C- Ctrl, A- Alt, S- Shift; letters lower case: C-k, A-d, F5, S-F5, A-F2, C-PGUP, UP, ENTER, BS, TAB ...
# Command names are those in the F1 help.
#key A-t = MacroBegin EditFile 'notes.txt' Return

# ---------------------------------------------------------------------------------------------
# JOE compatible keys that conflict with mkedit's (QEdit) keys
#
# Keys JOE uses that mkedit did not already use are bound by default. The ones below clash: the key
# already does something else in mkedit, so they are left off. For each, the comment says what JOE
# does with the key, what mkedit does with it now, and where mkedit keeps the JOE function. Remove the
# leading '#' from the "key" lines you want. Note the function that loses its key (see the last
# sentence of each comment); F1 shows every key as currently bound.
#
# These cannot be remapped, because mkedit uses them as fixed prefix keys: ^B (JOE: cursor left),
# ^O (JOE: backspace word) and ^Q (JOE: quote the next key), and ^K itself.
# ---------------------------------------------------------------------------------------------

# JOE ^K D: save the file.  mkedit: Exit (close the file, asking to save) is on this key now; SaveFile
#   is ^K S.  Exit is then only in the menu: Esc F E.
#key C-k d = SaveFile

# JOE ^K Z: shell escape.  mkedit: KillFile (DELETES the file on disk) is on this key now; Shell is F9
#   (also ^K ').  KillFile is then only in the menu: Esc F K.
#key C-k z = Shell

# JOE ^K H: help.  mkedit: UnmarkBlock is on this key now; QuickHelp is F1 and Alt-H.  UnmarkBlock stays
#   on Alt-U.
#key C-k h = QuickHelp

# JOE ^K F: find first.  mkedit: ChangeFilename is on this key now; Find is ^Q F.  ChangeFilename stays
#   on Alt-O.
#key C-k f = Find

# JOE ^K N: next window.  mkedit: NextFile is on this key now; NextWindow is ^O N.  NextFile stays on
#   Alt-N.
#key C-k n = NextWindow

# JOE ^K P: previous window.  mkedit: PrevFile is on this key now; PrevWindow is ^O P.  PrevFile is then
#   only in the menu: Esc F P.
#key C-k p = PrevWindow

# JOE ^K V: go to end of file.  mkedit: MoveBlock is on this key now; EndFile is ^Q C and Ctrl-PgDn.
#   MoveBlock stays on Alt-M and ^K M.
#key C-k v = EndFile

# JOE ^K Q: ask to save changed files, then exit (like GExit).  mkedit: PQuit (quit the file, warn if
#   changed) is on this key now; GExit is Alt-X.  PQuit is then only in the menu: Esc F Q.
#key C-k q = GExit

# JOE ^U: page up.  mkedit: UnKill is on this key now; PageUp is PgUp and ^R.  UnKill is then only in
#   the menu: Esc E U.
#key C-u = PageUp

# JOE ^V: page down.  mkedit: ToggleInsert is on this key now; PageDown is PgDn and ^C.  Ins still
#   toggles insert mode.
#key C-v = PageDown

# JOE ^W: delete word to the right.  mkedit: ScrollUp is on this key now; DelRtWord is ^T.  ScrollUp:
#   see Alt-W below.
#key C-w = DelRtWord

# JOE ^Z: previous word.  mkedit: ScrollDown is on this key now; WordLeft is ^A and Ctrl-Left.
#   ScrollDown: see Alt-Z below.
#key C-z = WordLeft

# JOE ^X: next word.  mkedit: CursorDown (the WordStar diamond) is on this key now; WordRight is ^F and
#   Ctrl-Right.  The Down arrow still moves down.
#key C-x = WordRight

# JOE ^J: delete to end of line.  mkedit: GotoLine is on this key now; DelToEol is F6 and ^Q Y.
#   GotoLine stays on ^K L.
#key C-j = DelToEol

# JOE ^A: go to start of line.  mkedit: WordLeft is on this key now; BegLine is Home and ^Q S.  Ctrl-
#   Left still moves a word left.
#key C-a = BegLine

# JOE ^E: go to end of line.  mkedit: CursorUp (the WordStar diamond) is on this key now; EndLine is End
#   and ^Q D.  The Up arrow still moves up.
#key C-e = EndLine

# JOE ^F: cursor right.  mkedit: WordRight is on this key now; CursorRight is the Right arrow and ^D.
#   Ctrl-Right still moves a word right.
#key C-f = CursorRight

# JOE ^N: cursor down.  mkedit: SplitLine is on this key now; CursorDown is the Down arrow and ^X.
#   SplitLine stays on Alt-S and ^].
#key C-n = CursorDown

# JOE ^P: cursor up.  mkedit: Literal (insert the next key as typed) is on this key now; CursorUp is the
#   Up arrow and ^E.  The second line keeps Literal on Ctrl-backslash.
#key C-p = CursorUp
#key C-\ = Literal

# JOE ^T: options menu.  mkedit: DelRtWord is on this key now; MainMenu is Esc (then O for Options).
#   With the ^W line above, DelRtWord moves to ^W.
#key C-t = MainMenu

# JOE ^G: go to the matching bracket.  mkedit: DelCh is on this key now; Match is Alt-F3.  Del still
#   deletes a character.
#key C-g = Match

# JOE ^D: delete character.  mkedit: CursorRight (the WordStar diamond) is on this key now; DelCh is Del
#   and ^G.  The Right arrow still moves right.
#key C-d = DelCh

# JOE ^R: refresh and recenter.  mkedit: PageUp is on this key now; MakeCtrofScreen is Shift-F5.  PgUp
#   still pages up.
#key C-r = MakeCtrofScreen

# JOE ^S: incremental search (mkedit has none).  mkedit: CursorLeft (the WordStar diamond) is on this
#   key now; the closest is Find, ^Q F.  The Left arrow still moves left.
#key C-s = Find

# JOE ^_: undo.  mkedit: GetPrev (copy the character above) is on this key now; Undo is Alt-/ and ^Q U.
#   The second line keeps GetPrev on Alt-T.
#key C-_ = Undo
#key A-t = GetPrev

# JOE Esc C (Alt-C): compile.  mkedit: CopyBlock (also ^K C) is on this key now; Compile is F10.
#key A-c = Compile

# JOE Esc G (Alt-G): grep.  mkedit: DeleteBlock (also ^K Y) is on this key now; GrepFind is Shift-F10.
#key A-g = GrepFind

# JOE Esc X (Alt-X): run a command.  mkedit: GExit (ask to save all files, exit) is on this key now; Dos
#   is Alt-F9, Alt-! and ^K !.  GExit is then on the menu: Esc Q X.
#key A-x = Dos

# JOE Esc B (Alt-B): go to the beginning of the marked block.  mkedit: WrapPara is on this key now;
#   GotoBlockBeg is ^Q B.  WrapPara stays on ^K J.
#key A-b = GotoBlockBeg

# JOE Esc K (Alt-K): go to the end of the marked block.  mkedit: MarkColumn is on this key now;
#   GotoBlockEnd is ^Q K.  MarkColumn is then only in the menu: Esc B K.
#key A-k = GotoBlockEnd

# JOE Esc W (Alt-W): scroll up one line.  mkedit: WriteBlock (also ^K W) is on this key now; ScrollUp is
#   ^W.  Use this together with the ^W line above.
#key A-w = ScrollUp

# JOE Esc Z (Alt-Z): scroll down one line.  mkedit: CopyOverBlock is on this key now; ScrollDown is ^Z.
#   CopyOverBlock then has no key.
#key A-z = ScrollDown

# JOE Esc Y (Alt-Y): undelete (yank).  mkedit: GSave (save all files) is on this key now; UnKill is ^U.
#   GSave is then on the menu: Esc Q S.
#key A-y = UnKill

# JOE Esc U (Alt-U): previous buffer.  mkedit: UnmarkBlock is on this key now; PrevFile is ^K P.
#   UnmarkBlock stays on ^K H.
#key A-u = PrevFile

# JOE Esc V (Alt-V): next buffer.  mkedit: ToggleTabsExpand is on this key now; NextFile is Alt-N and ^K
#   N.  ToggleTabsExpand is then only in the menu: Esc O T.
#key A-v = NextFile
